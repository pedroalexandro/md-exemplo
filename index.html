```
<main id="conteudo">
    <p class="carregando">Carregando...</p>
</main>

<script>
    const arquivoMarkdown = 'md/exemplo-markdown.md';

    async function carregarMarkdown() {
        try {
            const response = await fetch(arquivoMarkdown);

            if (!response.ok) {
                throw new Error(
                    `Erro HTTP ${response.status} ao carregar ${arquivoMarkdown}`
                );
            }

            const markdown = await response.text();

            const conteudo = document.getElementById('conteudo');

            conteudo.innerHTML = marked.parse(markdown);

            configurarCodigo();

        } catch (error) {
            document.getElementById('conteudo').innerHTML = `
                <div class="erro">
                    <h1>Erro ao carregar o Markdown</h1>
                    <p>${escapeHtml(error.message)}</p>
                </div>
            `;
        }
    }

    function configurarCodigo() {
        const blocos = document.querySelectorAll('pre code');

        blocos.forEach((bloco) => {

            const linguagem = obterLinguagem(bloco);

            if (linguagem) {
                destacarCodigo(bloco, linguagem);
            } else {
                destacarAutomaticamente(bloco);
            }

            adicionarBotaoCopiar(bloco);
        });
    }

    function obterLinguagem(bloco) {
        const classe = Array.from(bloco.classList).find(
            item => item.startsWith('language-')
        );

        if (!classe) {
            return '';
        }

        return classe
            .substring('language-'.length)
            .toLowerCase();
    }

    function destacarCodigo(bloco, linguagem) {
        const aliases = {
            js: 'javascript',
            jsx: 'javascript',
            ts: 'typescript',
            tsx: 'typescript',

            html: 'xml',
            htm: 'xml',
            xhtml: 'xml',

            css: 'css',

            sh: 'bash',
            shell: 'bash',

            ps: 'powershell',
            ps1: 'powershell',

            py: 'python',

            pas: 'delphi',
            pascal: 'delphi',
            objectpascal: 'delphi',
            object_pascal: 'delphi',

            cs: 'csharp',

            cpp: 'cpp',
            cxx: 'cpp',

            md: 'markdown',

            yml: 'yaml',

            text: 'plaintext',
            txt: 'plaintext'
        };

        const linguagemNormalizada =
            aliases[linguagem] || linguagem;

        if (hljs.getLanguage(linguagemNormalizada)) {

            bloco.classList.add(
                `language-${linguagemNormalizada}`
            );

            try {
                hljs.highlightElement(bloco);
            } catch (error) {
                console.warn(
                    `Erro ao destacar ${linguagemNormalizada}:`,
                    error
                );
            }

        } else {

            console.warn(
                `Linguagem não encontrada no Highlight.js: ${linguagem}`
            );

            destacarAutomaticamente(bloco);
        }
    }

    function destacarAutomaticamente(bloco) {
        try {
            hljs.highlightElement(bloco);
        } catch (error) {
            console.warn(
                'Não foi possível destacar o código:',
                error
            );
        }
    }

    function adicionarBotaoCopiar(bloco) {
        const pre = bloco.parentElement;

        if (!pre || pre.querySelector('.botao-copiar')) {
            return;
        }

        const botao = document.createElement('button');

        botao.className = 'botao-copiar';
        botao.type = 'button';
        botao.textContent = 'Copiar';

        botao.addEventListener('click', async () => {

            try {
                await navigator.clipboard.writeText(
                    bloco.innerText
                );

                botao.textContent = 'Copiado!';

                setTimeout(() => {
                    botao.textContent = 'Copiar';
                }, 1500);

            } catch (error) {

                botao.textContent = 'Erro';

                setTimeout(() => {
                    botao.textContent = 'Copiar';
                }, 1500);
            }
        });

        pre.appendChild(botao);
    }

    function escapeHtml(texto) {
        const div = document.createElement('div');

        div.textContent = texto;

        return div.innerHTML;
    }

    carregarMarkdown();
</script>
